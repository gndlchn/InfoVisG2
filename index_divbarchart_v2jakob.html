<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Global Economic Drivers - Group 2</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="style_v2jakob.css" />
  <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>
  <div id="tooltip" class="tooltip" style="position: absolute; opacity: 0; background: white; border: 1px solid #ccc; padding: 5px; pointer-events: none; z-index: 2000;"></div>

  <div class="container-fluid mt-3">
    <div class="row mb-3">
      <div class="col-12">
        <div class="card bg-light">
          <div class="card-body">
            <h2 class="card-title">Global Economic Drivers</h2>
            <p class="card-text">Click on the map or use filters to explore economic trends.</p>
          </div>
        </div>
      </div>
    </div>

    <div class="row mb-3">
      <div class="col-sm-9">
        <div class="card">
          <div class="card-header">Global Overview</div>
          <div class="card-body">
            <div id="map_chart" style="width:100%; height:400px; background: #f9f9f9;"></div>
          </div>
        </div>
      </div>
      <div class="col-sm-3">
        <div class="card h-100">
          <div class="card-header">Filters</div>
          <div class="card-body">
             <div class="mb-3">
                <label class="form-label" for="select_continent">Continent</label>
                <select class="form-select" id="select_continent">
                  <option value="All">All Continents</option>
                  <option value="Europe" selected>Europe</option>
                  <option value="Asia">Asia</option>
                  <option value="Africa">Africa</option>
                  <option value="Oceania">Oceania</option>
                  <option value="North America">North America</option>
                  <option value="South America">South America</option>
                </select>
              </div>
              <div class="mb-3">
                <label class="form-label">Year: <strong id="select_year-value">2012</strong></label>
                <input type="range" class="form-range" id="select_year" min="1960" max="2022" step="1" value="2012" />
              </div>
          </div>
        </div>
      </div>
    </div>

    <div class="row">
      <div class="col-12">
        <ul class="nav nav-tabs" id="plotsTab" role="tablist">
          <li class="nav-item">
            <button class="nav-link active" id="water-tab" data-bs-toggle="tab" data-bs-target="#tab1" type="button" role="tab">GDP Evolution</button>
          </li>
          <li class="nav-item">
            <button class="nav-link" id="bubble-tab" data-bs-toggle="tab" data-bs-target="#tab2" type="button" role="tab">Indicators</button>
          </li>
          <li class="nav-item">
            <button class="nav-link" id="bar-tab" data-bs-toggle="tab" data-bs-target="#tab3" type="button" role="tab">Trade (Import/Export)</button>
          </li>
        </ul>

        <div class="tab-content border-start border-end border-bottom p-3 bg-white" id="plotsTabContent">
          <div class="tab-pane fade show active" id="tab1" role="tabpanel">
            <div id="water_chart" class="plot-container" style="height:450px;"></div>
          </div>
          <div class="tab-pane fade" id="tab2" role="tabpanel">
            <div id="bubble_chart" class="plot-container" style="height:450px;"></div>
          </div>
          <div class="tab-pane fade" id="tab3" role="tabpanel">
            <div id="bar_chart" class="plot-container" style="min-height: 500px; width: 100%"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./script_v2jakob.js"></script>
</body>
</html>
