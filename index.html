<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>G2</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/dashboard.css" />

  <link rel="stylesheet" href="charts/map_chart/style.css" />
  <link rel="stylesheet" href="charts/water_chart/style.css" />
  <link rel="stylesheet" href="charts/bubble_chart/style.css" />
  <link rel="stylesheet" href="charts/bar_chart/style.css" />

  <script src="https://d3js.org/d3.v7.min.js"></script>
</head>

<body>

<div id="tooltip" class="tooltip"></div>

<div class="container-fluid mt-3">

  <!-- Header -->
  <div class="row mb-3">
    <div class="col-sm-6">
      <div class="card">
        <div class="card-body">
          <h5 class="mb-1">Global Economic Drivers</h5>
          <p class="mb-0">Overview of globalization and economic indicators</p>
        </div>
      </div>
    </div>

    <div class="col-sm-6">
      <div class="card">
        <div class="card-body">
          Click on the map or use the filters to select a country.
        </div>
      </div>
    </div>
  </div>

  <!-- Map row -->
  <div class="row mb-3">
    <div class="col-sm-3">
      <div class="card h-100">
        <div class="card-body">
          <div class="mb-3">
            <label class="form-label" for="select_continent">Continent</label>
            <select class="form-select" id="select_continent">
              <option value="Europe" selected>Europe</option>
              <option value="Asia">Asia</option>
              <option value="Africa">Africa</option>
              <option value="Oceania">Oceania</option>
              <option value="North America">North America</option>
              <option value="South America">South America</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label">Year</label>
            <input
              type="range"
              class="form-range"
              id="select_year"
              min="1960"
              max="2022"
              step="1"
              value="2012"
            />
            <div>
              <strong id="select_year-value">2012</strong>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="col-sm-9">
      <div class="card text-center">
        <div class="card-body">
          <div id="map_chart" style="width:100%; height:400px;"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Tabs + plots -->
  <div class="row mb-3">
    <div class="col-sm-8">

      <ul class="nav nav-tabs" id="plotsTab" role="tablist">
        <li class="nav-item">
          <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-water" type="button">
            Evolution of GDP
          </button>
        </li>
        <li class="nav-item">
          <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-bubble" type="button">
            Trade openness
          </button>
        </li>
        <li class="nav-item">
          <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-bar" type="button">
            Import versus Export
          </button>
        </li>
      </ul>

      <div class="tab-content pt-3">

        <div class="tab-pane fade show active" id="tab-water">
          <div class="row">
            <div class="col-sm-9">
              <div class="card">
                <div class="card-body">
                  <div id="water_chart" style="width:100%; height:400px;"></div>
                </div>
              </div>
            </div>
            <div class="col-sm-3">
              GDP evolution over time using a waterfall chart.
            </div>
          </div>
        </div>

        <div class="tab-pane fade" id="tab-bubble">
          <div class="row">
            <div class="col-sm-9">
              <div class="card">
                <div class="card-body">
                  <div id="bubble_chart" style="width:100%; height:400px;"></div>
                </div>
              </div>
            </div>
            <div class="col-sm-3">
              Trade, FDI and GDP size relationship.
            </div>
          </div>
        </div>

        <div class="tab-pane fade" id="tab-bar">
          <div class="row">
            <div class="col-sm-9">
              <div class="card">
                <div class="card-body">
                  <div id="bar_chart" style="width:100%; height:400px;"></div>
                </div>
              </div>
            </div>
            <div class="col-sm-3">
              Comparison of imports and exports.
            </div>
          </div>
        </div>

      </div>
    </div>

    <div class="col-sm-4">
      <div class="card h-100">
        <div class="card-body">
          Some description
        </div>
      </div>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/js/bootstrap.bundle.min.js"></script>

<script src="charts/map_chart/script.js"></script>
<script src="charts/water_chart/script.js"></script>
<script src="charts/bubble_chart/script.js"></script>
<script src="charts/bar_chart/script.js"></script>

<script src="js/dashboard.js"></script>

</body>
</html>
