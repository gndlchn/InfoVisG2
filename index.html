<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>G2</title>

  <!-- Bootstrap CSS (layout and styling) -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link rel="stylesheet" type="text/css" href="./style.css">
  <link href="https://cdn.jsdelivr.net/npm/tom-select/dist/css/tom-select.css" rel="stylesheet">


  <!-- D3 -->
  <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>
<div id="map-tooltip" 
     style="position:absolute; 
            background:white; 
            padding:6px 10px; 
            border:1px solid #ccc; 
            border-radius:4px; 
            pointer-events:none; 
            opacity:0; 
            font-size:12px;">
</div>


  <div class="container-fluid mt-3">
    <div class="row">
      <div class="col-sm-6">
        <div class="row mb-3">
          <div class="card">
            <div class="card-body" style="font-size: 28px;font-weight: bolder;">Global Economic Drivers: Trade, Investment, and Growth</div>
          </div>
        </div>
      </div>

      <!-- Right column -->
      <div class="col-sm-6">
        <div class="card mb-3">
          <div class="card-body">
            Click on the map or use the filters on the left to select a country
          </div>
        </div>
      </div>
    </div>

    <!-- Map row -->
    <div class="row mb-3">
      <div class="col-sm-3">
        <div class="card">
          <div class="card-body">indicator filter</div>
        </div>
      </div>
      <div class="col-sm-9">
        <div class="card text-center">
          <div class="card-body" style="padding: 0px;">
              <div id="map_chart" class="responsive-svg-container" style="min-height: 100%; width: 100%"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Tabs + plots -->
    <div class="row mb-3">
      <div class="col-sm-8">
        <ul class="nav nav-tabs" id="plotsTab" role="tablist">
          <li class="nav-item" role="presentation">
            <button
              class="nav-link active"
              id="tab1-tab"
              data-bs-toggle="tab"
              data-bs-target="#tab1"
              type="button"
              role="tab"
            >
              Evolution of GDP for *country*
            </button>
          </li>
          <li class="nav-item" role="presentation">
            <button
              class="nav-link"
              id="tab2-tab"
              data-bs-toggle="tab"
              data-bs-target="#tab2"
              type="button"
              role="tab"
            >
              Trade openness
            </button>
          </li>
          <li class="nav-item" role="presentation">
            <button
              class="nav-link"
              id="tab3-tab"
              data-bs-toggle="tab"
              data-bs-target="#tab3"
              type="button"
              role="tab"
            >
              Import versus Export
            </button>
          </li>
        </ul>

        <div class="tab-content pt-3" id="plotsTabContent">
          <!-- Tab 1 -->
          <div
            class="tab-pane fade show active"
            id="tab1"
            role="tabpanel"
            aria-labelledby="tab1-tab"
            >
            <div class="row">
              <div class="col-sm-9">
                <div class="card text-center">
                  <div class="card-body">
                    <div id="water_chart" class="responsive-svg-container" style="min-height: 100%; width: 100%"></div>
                  </div>
                </div>
              </div>
              <div class="col-sm-3">
                A short explanation about the plot 1
              </div>
            </div>
          </div>

          <!-- Tab 2 -->
          <div
            class="tab-pane fade"
            id="tab2"
            role="tabpanel"
            aria-labelledby="tab2-tab"
          >
            <div class="row">
              <div class="col-sm-9">
                <div class="card text-center">
                  <div class="card-body">
                    <div id="bubble_chart" class="responsive-svg-container" style="min-height: 100%; width: 100%"></div>
                  </div>
                </div>
              </div>
              <div class="col-sm-3">
                A short explanation about the plot 2
              </div>
            </div>
          </div>

          <!-- Tab 3 -->
          <div
            class="tab-pane fade"
            id="tab3"
            role="tabpanel"
            aria-labelledby="tab3-tab"
          >
            <div class="row" style="height: 100%;">
              <div class="col-sm-9">
                <div class="card text-center" style="height: 400px;"> 
                  <div class="card-body h-100"> 
                    <div id="bar" class="h-100 w-100"></div>
                  </div>
                </div>
              </div>
              <div class="col-sm-3">
                A short explanation about the plot 3
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="col-sm-4">
        <div class="row mb-3">
          <div class="card">
            <div class="card-body">
              <div class="mb-3">
                <label class="form-label" for="select_continent">Continent</label>
                <select class="form-select" id="select_continent">
                  <option value="Europe" selected>Europe</option>
                  <option value="Asia">Asia</option>
                  <option value="Africa">Africa</option>
                  <option value="Oceania">Oceania</option>
                  <option value="North America">North America</option>
                  <option value="South America">South America</option>
                </select>
              </div>
              <div class="mb-3"> 
                <label class="form-label" for="select_country">Country</label> 
                <select class="form-select" id="select_country"> 
                  <option value="" disabled selected>Select a country</option> 
                </select> 
              </div>
              <div class="mb-3">
                <label class="form-label" for="slider-wrapper">Year</label>
                <div class="slider-wrapper"> 
                  <input type="range" 
                    class="form-range" 
                    id="select_year" 
                    min="2010" 
                    max="2020" 
                    tep="1" 
                    value="2012" 
                    /> 
                  <div id="slider-popup" class="slider-popup"></div> 
                </div>
              </div>

            </div>
            </div>
          </div>
        </div>

      </div>

    </div>
  </div>

  <!-- JS dependencies at the end -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./d3.js"></script>
	<script src="./script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tom-select/dist/js/tom-select.complete.min.js"></script>
  <script src="https://unpkg.com/topojson@3"></script>
</body>
</html>
