<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Global Economic Drivers - Dashboard</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/dashboard.css">

  <link rel="stylesheet" href="charts/map_chart/style.css">
  <link rel="stylesheet" href="charts/water_chart/style.css">
  <link rel="stylesheet" href="charts/bubble_chart/style.css">
  <link rel="stylesheet" href="charts/bar_chart/style.css">

  <script src="https://d3js.org/d3.v7.min.js"></script>
</head>

<body>

  <div id="tooltip" class="tooltip"></div>

  <div class="container-fluid mt-3">

    <div class="row mb-3">
      <div class="col-12">
        <div class="card bg-light">
          <div class="card-body">
            <h2 class="card-title">Global Economic Drivers</h2>
            <p class="card-text">Click on the map or use filters to explore economic trends.</p>
          </div>
        </div>
      </div>
    </div>

    <div class="row mb-3">
      <div class="col-sm-9">
        <div class="card">
          <div class="card-header">Global Overview</div>
          <div class="card-body">
            <div id="map_chart" class="chart"></div>
          </div>
        </div>
      </div>

      <div class="col-sm-3">
        <div class="card h-100">
          <div class="card-header">Filters</div>
          <div class="card-body" id="filters">
            <div class="mb-3">
              <label class="form-label" for="select_continent">Continent</label>
              <select class="form-select" id="select_continent">
                <option value="All">All Continents</option>
                <option value="Europe" selected>Europe</option>
                <option value="Asia">Asia</option>
                <option value="Africa">Africa</option>
                <option value="Oceania">Oceania</option>
                <option value="North America">North America</option>
                <option value="South America">South America</option>
              </select>
            </div>

            <div class="mb-3">
              <label class="form-label">Year: <strong id="select_year-value">2012</strong></label>
              <input type="range" class="form-range" id="select_year" min="1960" max="2022" step="1" value="2012">
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="row">
      <div class="col-12">

        <ul class="nav nav-tabs" id="plotsTab" role="tablist">
          <li class="nav-item">
            <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-water" type="button">GDP Evolution</button>
          </li>
          <li class="nav-item">
            <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-bubble" type="button">Indicators</button>
          </li>
          <li class="nav-item">
            <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-bar" type="button">Trade (Import / Export)</button>
          </li>
        </ul>

        <div class="tab-content border-start border-end border-bottom p-3 bg-white">
          <div class="tab-pane fade show active" id="tab-water">
            <div id="water_chart" class="chart"></div>
          </div>

          <div class="tab-pane fade" id="tab-bubble">
            <div id="bubble_chart" class="chart"></div>
          </div>

          <div class="tab-pane fade" id="tab-bar">
            <div id="bar_chart" class="chart"></div>
          </div>
        </div>

      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/js/bootstrap.bundle.min.js"></script>

  <script src="charts/map_chart/script.js"></script>
  <script src="charts/water_chart/script.js"></script>
  <script src="charts/bubble_chart/script.js"></script>
  <script src="charts/bar_chart/script.js"></script>

  <script src="js/dashboard.js"></script>

</body>
</html>
